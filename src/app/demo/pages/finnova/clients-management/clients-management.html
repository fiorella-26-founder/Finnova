<!-- Modal para Asignar Asesor -->
<div class="modal fade" id="assignAdvisorModal" tabindex="-1" aria-labelledby="assignAdvisorModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="assignAdvisorModalLabel">Asignar Asesor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="advisorSelect" class="form-label">Seleccionar Asesor</label>
            <select class="form-select" id="advisorSelect">
              <option selected disabled>Elige un asesor...</option>
              <option value="1">Juan Asesor</option>
              <option value="2">Ana Especialista</option>
              <option value="3">Luis Consejero</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Guardar Asignación</button>
      </div>
    </div>
  </div>
</div>
