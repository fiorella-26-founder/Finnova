name: Finnova Synthetic Event Monitor (24/7)

on:
  schedule:
    # Sonda sintética cada 15 minutos: monitorea SLO y evita Cold Start en Render
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  synthetic-monitor:
    name: Sonda Sintética & Clasificación de Eventos
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Ejecutar Agente de Monitoreo y Políticas JSON
        run: node scripts/event-monitor.mjs --once
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: 4. Guardar Evidencia Telemetría NDJSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finnova-event-telemetry
          path: monitoring/logs/events.ndjson
          retention-days: 14
